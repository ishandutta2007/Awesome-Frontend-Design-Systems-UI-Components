<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1.2" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <!-- CSS Animation Styles -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.12); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes shimmerBorder {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 400; }
      }
      @keyframes pulseDot {
        0%, 100% { r: 4px; opacity: 1; }
        50% { r: 6.5px; opacity: 0.6; }
      }
      .anim-glow-1 {
        transform-origin: 200px 100px;
        animation: pulseGlow 7s ease-in-out infinite;
      }
      .anim-glow-2 {
        transform-origin: 1000px 320px;
        animation: pulseGlow 8s ease-in-out infinite 1s;
      }
      .anim-card-left {
        transform-origin: 100px 200px;
        animation: floatSlow1 6s ease-in-out infinite;
      }
      .anim-card-right {
        transform-origin: 1100px 200px;
        animation: floatSlow2 7s ease-in-out infinite;
      }
      .pulse-indicator {
        animation: pulseDot 2s ease-in-out infinite;
      }
      .shimmer-line {
        stroke-dasharray: 40 160;
        animation: shimmerBorder 12s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#grid-pattern)" />

  <!-- Background Dynamic Glowing Orbs (Deep behind text) -->
  <circle class="anim-glow-1" cx="220" cy="120" r="140" fill="#38bdf8" opacity="0.25" filter="url(#glow-cyan)" />
  <circle class="anim-glow-2" cx="980" cy="300" r="160" fill="#a855f7" opacity="0.28" filter="url(#glow-purple)" />
  <circle cx="600" cy="380" r="130" fill="#ec4899" opacity="0.15" filter="url(#glow-purple)" />

  <!-- Animated Background Elements - Left Side Preview Card -->
  <g class="anim-card-left" opacity="0.75">
    <rect x="40" y="70" width="190" height="135" rx="12" fill="url(#card-grad-1)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="65" cy="92" r="5" fill="#f43f5e" />
    <circle cx="80" cy="92" r="5" fill="#f59e0b" />
    <circle cx="95" cy="92" r="5" fill="#10b981" />
    <rect x="60" y="115" width="70" height="10" rx="5" fill="#38bdf8" fill-opacity="0.7" />
    <rect x="60" y="135" width="150" height="8" rx="4" fill="#64748b" fill-opacity="0.4" />
    <rect x="60" y="150" width="120" height="8" rx="4" fill="#64748b" fill-opacity="0.4" />
    <rect x="60" y="170" width="85" height="18" rx="6" fill="#6366f1" fill-opacity="0.8" />
  </g>

  <!-- Animated Background Elements - Right Side Preview Card -->
  <g class="anim-card-right" opacity="0.75">
    <rect x="970" y="210" width="190" height="145" rx="12" fill="url(#card-grad-1)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5" />
    <rect x="990" y="235" width="110" height="12" rx="6" fill="#c084fc" fill-opacity="0.8" />
    <rect x="990" y="260" width="150" height="8" rx="4" fill="#64748b" fill-opacity="0.4" />
    <!-- Mini KPI Chart Bars -->
    <rect x="990" y="310" width="16" height="25" rx="3" fill="#38bdf8" fill-opacity="0.6" />
    <rect x="1015" y="295" width="16" height="40" rx="3" fill="#818cf8" fill-opacity="0.7" />
    <rect x="1040" y="280" width="16" height="55" rx="3" fill="#a855f7" fill-opacity="0.8" />
    <rect x="1065" y="290" width="16" height="45" rx="3" fill="#c084fc" fill-opacity="0.75" />
    <rect x="1090" y="275" width="16" height="60" rx="3" fill="#f472b6" fill-opacity="0.9" />
  </g>

  <!-- Ambient Dynamic Shimmer Border around Canvas -->
  <rect class="shimmer-line" x="3" y="3" width="1194" height="414" rx="14" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.7" />

  <!-- FOREGROUND CONTENT: Guaranteed high contrast & clear z-index visibility -->
  
  <!-- Category Top Badge -->
  <g transform="translate(425, 52)">
    <rect x="0" y="0" width="350" height="34" rx="17" fill="#1e1b4b" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.2" />
    <circle class="pulse-indicator" cx="22" cy="17" r="4.5" fill="#10b981" />
    <text x="38" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e0e7ff" letter-spacing="1">CURATED DEVELOPER ECOSYSTEM 2026</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#primary-grad)" letter-spacing="-0.5">
    Frontend Design Systems &amp; UI Components
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#cbd5e1">
    Tailwind CSS Registries • Headless Primitives • Enterprise Design Systems • AI UI Builders
  </text>

  <!-- Feature Pills / Highlights (Centered Foreground) -->
  <g transform="translate(195, 240)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="175" height="44" rx="22" fill="#0f172a" fill-opacity="0.95" stroke="#38bdf8" stroke-width="1.4" />
    <text x="87" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#38bdf8">⚡ shadcn/ui &amp; Magic UI</text>

    <!-- Pill 2 -->
    <rect x="195" y="0" width="185" height="44" rx="22" fill="#0f172a" fill-opacity="0.95" stroke="#818cf8" stroke-width="1.4" />
    <text x="287" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#a5b4fc">🧩 Radix &amp; React Aria</text>

    <!-- Pill 3 -->
    <rect x="400" y="0" width="195" height="44" rx="22" fill="#0f172a" fill-opacity="0.95" stroke="#c084fc" stroke-width="1.4" />
    <text x="497" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#d8b4fe">🏢 Ant Design &amp; MUI X</text>

    <!-- Pill 4 -->
    <rect x="615" y="0" width="190" height="44" rx="22" fill="#0f172a" fill-opacity="0.95" stroke="#f472b6" stroke-width="1.4" />
    <text x="710" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f472b6">🤖 Vercel v0 &amp; Relume</text>
  </g>

  <!-- Metrics / Proof Bar in Lower Center -->
  <g transform="translate(300, 325)">
    <rect x="0" y="0" width="600" height="46" rx="12" fill="#0b1120" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <text x="80" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">130k+ Stars</text>
    <text x="80" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#94a3b8">TOP REGISTRIES</text>

    <line x1="160" y1="10" x2="160" y2="36" stroke="#334155" stroke-width="1" />

    <text x="240" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#818cf8">20+ Open-Source</text>
    <text x="240" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#94a3b8">CURATED FRAMEWORKS</text>

    <line x1="330" y1="10" x2="330" y2="36" stroke="#334155" stroke-width="1" />

    <text x="420" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#c084fc">10+ Commercial</text>
    <text x="420" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#94a3b8">VERIFIED PRICING</text>

    <line x1="500" y1="10" x2="500" y2="36" stroke="#334155" stroke-width="1" />

    <text x="550" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#10b981">100% Free Core</text>
    <text x="550" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#94a3b8">MIT LICENSED</text>
  </g>
</svg>
